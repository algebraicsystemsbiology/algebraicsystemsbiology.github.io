			/* Pull the page up a bit */
			#page-top {
				padding-top: 1rem !important;

			/* Keep the filter on the left and publications on the right */
			.publications-layout {
				display: flex !important;
				align-items: flex-start;
				gap: 2rem;
				margin-top: 0;
				width: 100%;
			}

			#publications-filter {
				flex: 0 0 18rem;
				max-width: 18rem;
			}

			#publications-list {
				flex: 1 1 auto;
				min-width: 0;
			}

			/* Make the filter menu vertical */
			#publications-filter ul.theme-filter-list {
				list-style: none;
				margin: 0;
				padding: 0;
				display: block;
			}

			#publications-filter ul.theme-filter-list li {
				display: block;
				margin: 0 0 0.5rem 0;
			}

			#publications-filter .theme-filter {
				width: 100%;
				text-align: left;
			}

			/* Let the layout stack nicely on small screens */
			@media screen and (max-width: 900px) {
				.publications-layout {
					flex-direction: column;
				}

				#publications-filter {
					flex: 1 1 auto;
					max-width: none;
					width: 100%;
				}
			}
		
  :root{ --ink:#30363d; --blue:#47D3E5; --pink:#db8992; }
  /* ===== Unified dot-burst menu (shared across all pages) ===== */
  .nav{position:fixed;top:2rem;left:2.5rem;z-index:50;display:flex;flex-direction:column;align-items:flex-start;gap:1rem}
  .nav-toggle{width:68px;height:68px;border:none!important;padding:0;background:transparent!important;cursor:pointer;
    box-shadow:none!important;border-radius:0;flex:none;
    display:grid;place-items:center;
    transition:transform .55s cubic-bezier(.2,.7,.2,1)}
  .nav-toggle:focus-visible{outline:2px solid var(--blue);outline-offset:4px}
  .nav.open .nav-toggle{transform:rotate(225deg)}
  .nav-toggle svg{width:44px;height:44px;display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
  .nav-toggle .b{fill:var(--blue)} .nav-toggle .p{fill:var(--pink)} .nav-toggle .c{fill:#fff}
  .nav-links{display:flex;flex-direction:column;align-items:stretch;gap:0;margin:0;padding:0;
    min-width:230px;opacity:0;transform:translateY(-8px);
    pointer-events:none;transition:opacity .4s ease,transform .4s ease}
  .nav.open .nav-links{opacity:1;transform:none;pointer-events:auto;
    background:#fff;border-radius:6px;padding:.25rem 1.1rem;
    box-shadow:0 6px 24px rgba(0,0,0,.22)}
  .nav-links a{text-decoration:none;color:#30363d;text-transform:uppercase;letter-spacing:.08em;
    font-size:.82rem;font-weight:600;white-space:nowrap;
    padding:.7rem 0;border-top:1px solid rgba(0,0,0,.14);
    opacity:0;transform:translateY(4px);
    transition:color .2s,opacity .4s,transform .4s}
  .nav-links a:first-child{border-top:0}
  .nav.open .nav-links a{opacity:1;transform:none}
  .nav.open .nav-links a:nth-child(1){transition-delay:.05s}
  .nav.open .nav-links a:nth-child(2){transition-delay:.11s}
  .nav.open .nav-links a:nth-child(3){transition-delay:.17s}
  .nav.open .nav-links a:nth-child(4){transition-delay:.23s}
  .nav.open .nav-links a:nth-child(5){transition-delay:.29s}
  .nav.open .nav-links a:nth-child(6){transition-delay:.35s}
  .nav.open .nav-links a:nth-child(7){transition-delay:.41s}
  .nav.open .nav-links a:nth-child(8){transition-delay:.47s}
  .nav-links a:hover{color:var(--blue)}
  /* Sub-links inside the panel (submenu items) */
  .nav-links a.sub{text-transform:none;letter-spacing:.02em;font-size:.74rem;font-weight:400;
    padding:.45rem 0 .45rem 1.1rem;border-top:1px dotted rgba(0,0,0,.12);color:#5a616b}
  .nav-links a.sub:hover{color:var(--blue)}
  @media (max-width:860px){
    .nav{top:1.25rem;left:1.25rem}
    .nav-links{min-width:180px}
    .nav-links a{font-size:.72rem;letter-spacing:.05em}
  }
  @media (prefers-reduced-motion:reduce){
    .nav-toggle,.nav-links,.nav-links a{transition:none!important}
  }

</style>

	  <script>
    (function(){
      var nav=document.getElementById('nav'),btn=document.getElementById('navToggle');
      if(!nav||!btn)return;
      function setOpen(o){nav.classList.toggle('open',o);
        btn.setAttribute('aria-expanded',o?'true':'false');
        btn.setAttribute('aria-label',o?'Close menu':'Open menu');}
      btn.addEventListener('click',function(){setOpen(!nav.classList.contains('open'))});
      document.addEventListener('keydown',function(e){if(e.key==='Escape')setOpen(false)});
      document.addEventListener('click',function(e){if(!nav.contains(e.target))setOpen(false)});
    })();
  </script>
