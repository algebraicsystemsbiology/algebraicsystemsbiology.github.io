<!DOCTYPE HTML>
<html>
	<head>
		<title>Publications and Preprints | Algebraic Systems Biology</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="assets/css/main.css" />
		<noscript><link rel="stylesheet" href="assets/css/noscript.css" /></noscript>
		<link rel="stylesheet" href="assets/css/nav.css" />

		<style>
			/* Pull the page up a bit */
			#page-top {
				padding-top: 1rem !important;
			}

			/* Keep the filter on the left and publications on the right */
			.publications-layout {
				display: flex !important;
				align-items: flex-start;
				gap: 2rem;
				margin-top: 0;
				width: 100%;
			}

			#publications-filter {
				flex: 0 0 18rem;
				max-width: 18rem;
			}

			#publications-list {
				flex: 1 1 auto;
				min-width: 0;
			}

			/* The theme subtitle is empty until a theme is chosen, but keeps its
			   line either way -- otherwise picking a theme adds a line and shoves
			   the filter list and every publication down the page.
			   1lh is exactly one line box of this element's own line-height; the
			   em value above it is the fallback for browsers without lh units. */
			#theme-title {
				min-height: 1.7em;
				min-height: 1lh;
			}

			/* Make the filter menu vertical */
			#publications-filter ul.theme-filter-list {
				list-style: none;
				margin: 0;
				padding: 0;
				display: block;
			}

			#publications-filter ul.theme-filter-list li {
				display: block;
				margin: 0 0 0.5rem 0;
			}

			#publications-filter .theme-filter {
				width: 100%;
				text-align: left;
			}

			/* Let the layout stack nicely on small screens */
			@media screen and (max-width: 900px) {
				.publications-layout {
					flex-direction: column;
				}

				#publications-filter {
					flex: 1 1 auto;
					max-width: none;
					width: 100%;
				}
			}
		
  :root{ --ink:#30363d; --blue:#47D3E5; --pink:#db8992; }
  /* ===== Unified dot-burst menu (shared across all pages) ===== */
  
  
  
  
  
    
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  /* Sub-links inside the panel (submenu items) */
  
  
  
  

</style>
	</head>

	<body class="is-preload">

<div class="site-logo-bar">
	<a class="site-logo" href="index.html" aria-label="Algebraic Systems Biology — home">
		<img src="images/asb-logo-transparent.svg" alt="Algebraic Systems Biology" />
	</a>
</div>

  <nav class="nav" id="nav" aria-label="Primary"></nav>


		<div id="wrapper" class="divided">

			<section class="wrapper style1" id="page-top">
				<div class="inner">
					<header>
						<h1>Publications and Preprints</h1>
						<!-- Filled in by assets/js/publications.js with the name of
						     the theme being filtered on, and left empty when there
						     is none. Starts empty so the unfiltered view does not
						     flash a subtitle before the script runs. -->
						<p id="theme-title"></p>
						<p id="theme-editorial" class="publication-editorial" hidden></p>
					</header>

					<div class="publications-layout">
						<aside id="publications-filter">
							<!-- Filled by assets/js/publications.js from
							     data/research-themes.json, the one list of the
							     research themes. Do not write the buttons here:
							     the copy that used to live in this file had
							     drifted from that list in name, colour and
							     membership. -->
							<ul class="alt theme-filter-list" id="theme-filter-list"></ul>
						</aside>

						<div id="publications-list"></div>
					</div>
				</div>
			</section>

<footer class="wrapper style1 align-center" id="site-footer"></footer>

		</div>

		<script src="assets/js/jquery.min.js"></script>

		<script src="assets/js/site-nav.js"></script>
		<script src="assets/js/site-footer.js"></script>
		<script src="assets/js/publications.js"></script>
</body>
</html>
