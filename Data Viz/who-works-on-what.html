<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Who Works On What | Algebraic Systems Biology</title>

<!--
  Standalone network of researchers and the themes they work on, embedded in
  an iframe by people.html. It lived inline in that page; extracting it keeps
  the visualisation's markup, styles and 250 lines of D3 in one place, beside
  the other diagram in this folder.

  The data path is relative to this file, so it reaches up out of "Data Viz".
-->

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    /* Transparent, so whatever the iframe sits on shows through: the page's
       beige on screen and in the screen-shaped export, and white on paper,
       where print.css strips the frame's own background. Painting a colour here
       instead put a tan block on an otherwise white sheet, and painting white
       put a white block on the beige page. */
    background: transparent;
    font-family: 'Source Sans Pro', 'Helvetica Neue', sans-serif;
    color: #30363d;
  }

  .frame-inner {
    padding: 0 1rem 1rem;
    text-align: center;
  }

.network-block {
  width: 100%;
  max-width: 1400px;
  margin: 0 auto;
  position: relative;
}
.network-block svg {
  width: 100%;
  min-height: 860px;
  height: auto;
  overflow: visible;
}

/* On a phone the whole diagram goes on the screen, small but complete.
   Sideways scrolling was worse than small: you cannot see a connection when
   its two ends are never on screen together, which is the only thing this
   diagram is for.

   Its viewBox is 1200 wide and about 1456 tall, so width: 100% with height:
   auto gives the full drawing at whatever the screen allows. min-height must
   go, or the box stays 860 tall and the drawing floats in the middle of it. */
@media (max-width: 900px) {
  .frame-inner {
    /* Almost no side padding: every pixel of width is a pixel of diagram. */
    padding: 0 0.25rem 0.5rem;
  }
  .network-block {
    overflow: visible;
  }
  .network-block svg {
    min-height: 0;
    min-width: 0;
  }
  .network-caption {
    font-size: 0.7rem;
  }
}

.link {
  stroke-opacity: 0.28;
  transition: stroke-opacity 0.2s;
}
.node circle {
  cursor: pointer;
}
.node text {
  font-family: "Source Sans Pro", "Helvetica Neue", sans-serif;
  font-size: 15px;
  fill: #555;
  cursor: pointer;
}
/* One target per node, covering the dot and its name together, so the gap
   between them is not dead space. Transparent, and sized from the node's own
   bounding box once both parts are drawn. */
.node .hit {
  fill: transparent;
  cursor: pointer;
}
.node.theme text {
  font-size: 15px;
  font-weight: 600;
  fill: #333;
}
.node.dimmed circle {
  opacity: 0.1;
}
.node.dimmed text {
  opacity: 0.1;
}
.link.dimmed {
  stroke-opacity: 0.04;
}
.link.highlighted {
  stroke-opacity: 0.8;
}
.node.highlighted text {
  fill: #111;
  font-weight: 600;
}
#network-tooltip {
  position: fixed;
  background: rgba(255,255,255,0.97);
  border: 1px solid #e0e0e0;
  border-radius: 6px;
  padding: 0.7rem 1rem;
  font-family: 'Helvetica Neue', sans-serif;
  font-size: 0.76rem;
  color: #333;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.15s;
  max-width: 280px;
  line-height: 1.5;
  z-index: 100;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
}
#network-tooltip strong {
  display: block;
  font-size: 0.82rem;
  color: #111;
  margin-bottom: 0.2rem;
}
#network-tooltip .sub {
  color: #7fc6c8;
  font-size: 0.68rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
#network-tooltip .about {
  margin: 0.45rem 0 0;
  color: #4a4f57;
  font-size: 0.72rem;
  line-height: 1.5;
}
#network-tooltip .themes-list {
  margin-top: 0.35rem;
  color: #888;
  font-size: 0.68rem;
  line-height: 1.6;
}
.network-legend {
  display: flex;
  gap: 1.8rem;
  justify-content: center;
  font-family: 'Helvetica Neue', sans-serif;
  font-size: 0.7rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #888;
  flex-wrap: wrap;
  margin-bottom: 1rem;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 0.45rem;
}
.legend-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
}
.network-caption {
  text-align: center;
  font-family: 'Helvetica Neue', sans-serif;
  font-size: 0.68rem;
  color: #bbb;
  letter-spacing: 0.05em;
  margin-top: 1rem;
}
</style>
</head>
<body>

  <div class="frame-inner">
<!--     <div class="network-legend">
      <div class="legend-item">
        <div class="legend-dot" style="background:linear-gradient(90deg,#889baa,#c8a794)"></div>
        <span>Research Theme</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background:#b0b8be"></div>
        <span>Researcher</span>
      </div>
    </div> -->

    <div class="network-block">
      <svg id="network-svg"></svg>
      <p id="network-state-message" hidden></p>
    </div>

    <p class="network-caption">Touch or hover a name to trace its connections.</p>
  </div>

  <div id="network-tooltip"></div>

<script>
(function () {

// Theme colours — matching the site's own gradient exactly
// (blue-grey → mauve → warm terracotta, as shown in the keyword filter UI)
// Theme colours come from data/research-themes.json, the one place the themes
// are written. They used to be hardcoded here, and the copy had already drifted
// from the data: one theme was keyed "Other Applications" when the data called
// it "From Coral to Contagions", so its nodes had no colour at all.
let THEME_COLOURS = {};
// The same descriptions the research page's cards show, so a theme explains
// itself here too rather than only offering a name and a count.
let THEME_ABOUT = {};

async function loadThemeColours() {
  const res = await fetch('/data/research-themes.json', { cache: 'no-cache' });
  if (!res.ok) throw new Error(`Failed to load research-themes.json: ${res.status}`);
  const themes = await res.json();
  THEME_COLOURS = Object.fromEntries(themes.map(t => [t.name, t.colour]));
  THEME_ABOUT = Object.fromEntries(themes.map(t => [t.name, t.description || '']));
}

// People nodes: single neutral tone, differentiated only by size
const PERSON_COLOUR = "#b0b8be";

// ── Data loading ─────────────────────────────────────────────────────
// This is the only part of the page that talks to the data file. Everything
// below is rendering logic that reacts to whatever it's given — so updating
// ../data/group_members.json (adding, removing, or editing a member's keywords)
// is all that's needed to change what's drawn here. No code changes required.

const DATA_URL = '/data/group_members.json';

async function loadMembers() {
  await loadThemeColours();
  const res = await fetch(DATA_URL, { cache: 'no-store' });
  if (!res.ok) throw new Error(`Failed to load ${DATA_URL}: ${res.status}`);
  const raw = await res.json();

  const knownThemes = new Set(Object.keys(THEME_COLOURS));

  const members = Object.values(raw)
    .filter(m => m && m.temporal_tag === 'Current' && m.name_full)
    .map(m => ({
      id: m.name_full,
      role: (m.internal_roles && m.internal_roles[0]) || '',
      keywords: (m.keywords || []).filter(k => knownThemes.has(k))
    }))
    // Someone tagged with no research theme has nothing to join here, and drew
    // as a lone dot with no line at all.
    .filter(m => m.keywords.length > 0)
    .sort((a, b) => a.id.localeCompare(b.id));

  return members;
}

function showMessage(text) {
  const el = document.getElementById('network-state-message');
  el.textContent = text;
  el.hidden = false;
  document.getElementById('network-svg').style.display = 'none';
}

// ── Render ───────────────────────────────────────────────────────────


  function wrapLabel(text, maxCharsPerLine = 20) {
    if (text.length <= maxCharsPerLine) return [text];
    const words = text.split(' ');
    let line1 = '', line2 = '';
    for (const word of words) {
      // Once a word has gone to the second line every later word follows it.
      // Without that, a short word that still fits the first line jumps ahead
      // of the longer ones already pushed down, and the name reads back
      // scrambled: "Applied Algebraic & / Geometry Tensors".
      if (!line2 && ((line1 + ' ' + word).trim().length <= maxCharsPerLine || !line1)) {
        line1 = (line1 + ' ' + word).trim();
      } else {
        line2 = (line2 + ' ' + word).trim();
      }
    }
    return line2 ? [line1, line2] : [line1];
  }

  function render(members) {
  const themes = Object.keys(THEME_COLOURS).filter(
    t => members.some(m => m.keywords.includes(t))
  );

  if (!members.length || !themes.length) {
    showMessage('No current members with tagged research themes yet.');
    return;
  }

  const edges = [];
  members.forEach(m => {
    m.keywords.forEach(kw => {
      if (themes.includes(kw)) edges.push({ source: m.id, target: kw });
    });
  });

  const width = 1200, height = Math.max(1100, Math.max(members.length, themes.length) * 26);
  // Who on the left, what they work on on the right, so the picture reads in
  // the same order as its title. People sit further in than the themes did,
  // because a name label runs leftwards and the longest is about 220px.
  const peopleX = 300, themeX = 900;
  const topPad = 55, bottomPad = 55;

  const svg = d3.select('#network-svg').attr('viewBox', `0 0 ${width} ${height}`);
  svg.selectAll('*').remove();

  const themeY = d3.scalePoint()
    .domain(themes)
    .range([topPad, height - bottomPad])
    .padding(0.3);

  const memberY = d3.scalePoint()
    .domain(members.map(m => m.id))
    .range([topPad, height - bottomPad])
    .padding(0.2);

  const nodePos = {};
  themes.forEach(t  => { nodePos[t]    = { x: themeX,  y: themeY(t)    }; });
  members.forEach(m => { nodePos[m.id] = { x: peopleX, y: memberY(m.id) }; });

  const themeDegree  = {};
  themes.forEach(t  => { themeDegree[t] = members.filter(m => m.keywords.includes(t)).length; });
  const memberDegree = {};
  members.forEach(m => { memberDegree[m.id] = m.keywords.length; });

  // Links — coloured by theme
  const linkSel = svg.append('g').selectAll('path')
    .data(edges)
    .join('path')
    .attr('class', 'link')
    .attr('d', d => {
      const s = nodePos[d.source], t = nodePos[d.target];
      const mx = (s.x + t.x) / 2;
      return `M${s.x},${s.y} C${mx},${s.y} ${mx},${t.y} ${t.x},${t.y}`;
    })
    .attr('fill', 'none')
    .attr('stroke', d => THEME_COLOURS[d.target] || '#aaa')
    .attr('stroke-width', 1.4);

  // Theme nodes
  const themeNodes = svg.append('g').selectAll('g')
    .data(themes)
    .join('g')
    .attr('class', 'node theme')
    .attr('transform', d => `translate(${themeX},${themeY(d)})`);

  themeNodes.append('circle')
    .attr('r', d => 7 + Math.sqrt(themeDegree[d]) * 3.5)
    .attr('fill', d => THEME_COLOURS[d])
    .attr('fill-opacity', 0.9);

  themeNodes.each(function(d) {
    const lines = wrapLabel(d);
    const lineHeight = 26;
    const startDy = -((lines.length - 1) * lineHeight) / 2;
    const g = d3.select(this);
    lines.forEach((line, i) => {
      g.append('text')
        .attr('x', 28)
        .attr('dy', (startDy + i * lineHeight) + 'px')
        .attr('text-anchor', 'start')
        .attr('dominant-baseline', 'middle')
        .text(line);
    });
  });

  // Member nodes
  const memberNodes = svg.append('g').selectAll('g')
    .data(members)
    .join('g')
    .attr('class', 'node member')
    .attr('transform', d => `translate(${peopleX},${memberY(d.id)})`);

  memberNodes.append('circle')
    .attr('r', d => d.role === 'Director' ? 18 : 7 + Math.sqrt(memberDegree[d.id]) * 3)
    .attr('fill', PERSON_COLOUR)
    .attr('fill-opacity', 0.85);

  memberNodes.append('text')
    .attr('x', -22).attr('dy', '0.35em')
    .attr('text-anchor', 'end')
    .text(d => d.id);

  // The dot alone is a small target, and the name beside it is what people
  // actually point at. Each node gets one hit area covering both.
  function addHitArea(selection) {
    selection.each(function () {
      const b = this.getBBox();
      d3.select(this).insert('rect', ':first-child')
        .attr('class', 'hit')
        .attr('x', b.x - 8).attr('y', b.y - 5)
        .attr('width', b.width + 16).attr('height', b.height + 10);
    });
  }
  addHitArea(themeNodes);
  addHitArea(memberNodes);

  // Interaction
  const tooltip = d3.select('#network-tooltip');
  let pinned = null;

  function connectedIds(id) {
    const s = new Set([id]);
    edges.forEach(e => {
      if (e.source === id) s.add(e.target);
      if (e.target === id) s.add(e.source);
    });
    return s;
  }

  function highlight(id) {
    const s = connectedIds(id);
    d3.selectAll('.node')
      .classed('dimmed',      d => !s.has(d.id || d))
      .classed('highlighted', d =>  s.has(d.id || d));
    linkSel
      .classed('dimmed',      d => d.source !== id && d.target !== id)
      .classed('highlighted', d => d.source === id || d.target === id);
  }

  function clear() {
    d3.selectAll('.node').classed('dimmed', false).classed('highlighted', false);
    linkSel.classed('dimmed', false).classed('highlighted', false);
  }

  // The tooltip sits beside the dot it explains rather than following the
  // pointer, which put it on top of whatever you were reading. It goes on the
  // side away from the label -- right of a person, left of a theme -- so it
  // cannot cover the name it is describing.
  function tipAt(nodeEl, html, side) {
    tooltip.html(html).style('opacity', 1);
    const dot = nodeEl.querySelector('circle').getBoundingClientRect();
    const box = tooltip.node().getBoundingClientRect();
    const gap = 16;
    let left = side === 'right' ? dot.right + gap : dot.left - gap - box.width;
    let top = dot.top + dot.height / 2 - box.height / 2;
    // Keep it inside the frame even for the topmost, lowest and longest of them.
    left = Math.max(8, Math.min(left, window.innerWidth - box.width - 8));
    top = Math.max(8, Math.min(top, window.innerHeight - box.height - 8));
    tooltip.style('left', left + 'px').style('top', top + 'px');
  }

  function hideTip() {
    tooltip.style('opacity', 0);
  }

  // Names carry ampersands and the descriptions are prose, so both are escaped
  // before going into the tooltip's markup.
  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  const themeHtml = d =>
    `<strong>${esc(d)}</strong>` +
    `<span class="sub">${themeDegree[d]} researcher${themeDegree[d] !== 1 ? 's' : ''}</span>` +
    (THEME_ABOUT[d] ? `<p class="about">${esc(THEME_ABOUT[d])}</p>` : '');
  const memberHtml = d =>
    `<strong>${esc(d.id)}</strong><span class="sub">${esc(d.role)}</span>` +
    (d.keywords.length ? `<div class="themes-list">${esc(d.keywords.join(' · '))}</div>` : '');

  themeNodes
    .on('mouseover', function (ev, d) {
      if (!pinned) { highlight(d); tipAt(this, themeHtml(d), 'left'); }
    })
    .on('mouseout', () => { if (!pinned) { clear(); hideTip(); } })
    .on('click', function (ev, d) {
      if (pinned === d) { pinned = null; clear(); hideTip(); }
      else { pinned = d; highlight(d); tipAt(this, themeHtml(d), 'left'); }
    });

  memberNodes
    .on('mouseover', function (ev, d) {
      if (!pinned) { highlight(d.id); tipAt(this, memberHtml(d), 'right'); }
    })
    .on('mouseout', () => { if (!pinned) { clear(); hideTip(); } })
    .on('click', function (ev, d) {
      if (pinned === d.id) { pinned = null; clear(); hideTip(); }
      else { pinned = d.id; highlight(d.id); tipAt(this, memberHtml(d), 'right'); }
    });


  svg.on('click', ev => {
    if (ev.target === svg.node()) { pinned = null; clear(); hideTip(); }
  });
}

loadMembers()
  .then(render)
  .catch(err => {
    console.error(err);
    showMessage('Sorry — the research network could not be loaded.');
  });

})();
</script>

<script>
  // Report our height so the embedding page can size the iframe to fit.
  // Without this the frame keeps a fixed height and the diagram, which is
  // taller than any sensible fixed value, gets its own scrollbar.
  (function () {
    var last = 0;

    function postHeight() {
      // The *content's* height, not the document's. documentElement
      // .scrollHeight can never be less than the viewport, and the viewport
      // here is the frame the parent sizes from this number -- so reporting
      // it fed straight back: the parent set the frame to content + 4, the
      // next measurement read content + 4, and the frame grew by four pixels
      // for as long as the page was open, sliding everything below it down.
      var content = document.querySelector('.frame-inner');
      var h = Math.ceil(content ? content.getBoundingClientRect().height
                                : document.documentElement.scrollHeight);
      if (!h || Math.abs(h - last) < 2) return;
      last = h;
      if (window.parent !== window) {
        window.parent.postMessage({ type: 'asb-network-resize', height: h }, '*');
      }
    }

    window.addEventListener('load', postHeight);
    window.addEventListener('resize', postHeight, { passive: true });

    // The SVG is built asynchronously after the data loads, so watch for it.
    if (window.ResizeObserver) {
      new ResizeObserver(postHeight).observe(document.body);
    } else {
      setInterval(postHeight, 500);
    }
  })();
</script>
</body>
</html>
